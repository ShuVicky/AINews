<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 早知道</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --bg-card: #1a1d27; --bg-card-hover: #1f2235;
    --border: #2a2d3e; --border-light: #353850;
    --text-primary: #e8eaf0; --text-secondary: #9498b0; --text-muted: #5a5e78;
    --accent: #5c7cfa; --tag-supply: #1a3a2a; --tag-supply-text: #4ade80;
    --tag-industry: #1a2a3a; --tag-industry-text: #60a5fa;
    --tag-aihot: #2a1a3a; --tag-aihot-text: #c084fc;
    --dot-supply: #4ade80; --dot-industry: #60a5fa; --dot-aihot: #c084fc;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --radius: 8px;
  }
  html { font-size: 15px; }
  body { font-family: var(--font); background: var(--bg); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
  .shell { max-width: 860px; margin: 0 auto; padding: 0 16px 80px; }
  .header { padding: 32px 0 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; }
  .logo-text { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
  .logo-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 1px; }
  .header-meta { font-size: 0.78rem; color: var(--text-muted); text-align: right; }
  .header-meta span { display: block; }
  .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; margin-right: 5px; vertical-align: middle; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab { padding: 8px 16px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius) var(--radius) 0 0; border: 1px solid transparent; border-bottom: none; transition: all 0.15s; user-select: none; margin-bottom: -1px; background: transparent; }
  .tab:hover { color: var(--text-primary); background: var(--bg-card); }
  .tab.active { color: var(--text-primary); background: var(--bg-card); border-color: var(--border); font-weight: 500; }
  .tab-count { font-size: 0.72rem; background: var(--border-light); color: var(--text-muted); padding: 1px 6px; border-radius: 10px; margin-left: 5px; }
  .state-box { text-align: center; padding: 64px 0; color: var(--text-muted); }
  .state-box .icon { font-size: 2rem; margin-bottom: 12px; }
  .state-box p { font-size: 0.9rem; }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border-light); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .feed { display: flex; flex-direction: column; gap: 1px; }
  .item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; transition: background 0.12s, border-color 0.12s; }
  .item:hover { background: var(--bg-card-hover); border-color: var(--border-light); }
  .item-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .item-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
  .item-title { font-size: 0.92rem; font-weight: 500; line-height: 1.5; color: var(--text-primary); }
  .item-title a { color: inherit; text-decoration: none; }
  .item-title a:hover { color: var(--accent); }
  .item-summary { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.55; margin-left: 17px; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .item-footer { display: flex; align-items: center; gap: 8px; margin-left: 17px; flex-wrap: wrap; }
  .source-tag { font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; font-weight: 500; white-space: nowrap; }
  .tag-supply { background: var(--tag-supply); color: var(--tag-supply-text); }
  .tag-industry { background: var(--tag-industry); color: var(--tag-industry-text); }
  .tag-aihot { background: var(--tag-aihot); color: var(--tag-aihot-text); }
  .item-source-name { font-size: 0.75rem; color: var(--text-muted); }
  .item-time { font-size: 0.72rem; color: var(--text-muted); margin-left: auto; }
  .empty { text-align: center; padding: 48px 0; color: var(--text-muted); font-size: 0.88rem; }
  .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .footer a { color: var(--text-muted); text-decoration: none; }
  .footer a:hover { color: var(--text-secondary); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-secondary); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  @media (max-width: 600px) { .header-top { flex-direction: column; align-items: flex-start; } .header-meta { text-align: left; } .item-time { margin-left: 0; } }
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">AI</div>
        <div>
          <div class="logo-text">AI 早知道</div>
          <div class="logo-sub">每日 AI 资讯 · 供应链 · 行业动态</div>
        </div>
      </div>
      <div class="header-meta">
        <span><span class="status-dot"></span>实时更新</span>
        <span id="last-updated">加载中…</span>
      </div>
    </div>
  </header>
  <div class="tabs">
    <div class="tab active" data-tab="all">全部 <span class="tab-count" id="cnt-all">—</span></div>
    <div class="tab" data-tab="aihot">AI 精选 <span class="tab-count" id="cnt-aihot">—</span></div>
    <div class="tab" data-tab="supply-chain">供应链 <span class="tab-count" id="cnt-supply">—</span></div>
    <div class="tab" data-tab="industry">行业报告 <span class="tab-count" id="cnt-industry">—</span></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--dot-aihot)"></div>AI 精选（aihot.news）</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--dot-supply)"></div>供应链 / 芯片</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--dot-industry)"></div>行业报告 / 媒体</div>
  </div>
  <div id="feed-container">
    <div class="state-box"><div class="spinner"></div><p>正在加载最新资讯…</p></div>
  </div>
  <footer class="footer">
    <span>数据来源：<a href="https://aihot.news" target="_blank">aihot.news</a> · NVIDIA · AMD · SemiAnalysis · DigiTimes · TheElec · MIT TR · VentureBeat</span>
    <span>内部使用</span>
  </footer>
</div>
<script>
const AIHOT_API = "https://aihot.news/api/v1/items?limit=50&window=24h";
const CUSTOM_JSON = "https://raw.githubusercontent.com/ShuVicky/AINews/main/data/custom-sources.json";
let allItems = [], currentTab = "all";

function relativeTime(d) {
  if (!d) return "";
  const s = (Date.now() - new Date(d).getTime()) / 1000;
  if (s < 60) return "刚刚";
  if (s < 3600) return `${Math.floor(s/60)} 分钟前`;
  if (s < 86400) return `${Math.floor(s/3600)} 小时前`;
  return `${Math.floor(s/86400)} 天前`;
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function catMeta(c) {
  if (c==="aihot") return {cls:"tag-aihot",dot:"var(--dot-aihot)",label:"AI 精选"};
  if (c==="supply-chain") return {cls:"tag-supply",dot:"var(--dot-supply)",label:"供应链"};
  return {cls:"tag-industry",dot:"var(--dot-industry)",label:"行业"};
}
function renderFeed(items) {
  const el = document.getElementById("feed-container");
  if (!items.length) { el.innerHTML='<div class="empty">暂无内容</div>'; return; }
  el.innerHTML = '<div class="feed">' + items.map(item => {
    const m = catMeta(item.category);
    const link = item.link || (item.links&&item.links.original) || "#";
    const sn = item.source_name || (item.source&&item.source.name) || "";
    const sum = item.summary ? `<div class="item-summary">${esc(item.summary)}</div>` : "";
    return `<div class="item">
  <div class="item-header"><div class="item-dot" style="background:${m.dot}"></div>
  <div class="item-title"><a href="${esc(link)}" target="_blank" rel="noopener">${esc(item.title)}</a></div></div>
  ${sum}
  <div class="item-footer"><span class="source-tag ${m.cls}">${m.label}</span>
  <span class="item-source-name">${esc(sn)}</span>
  <span class="item-time">${relativeTime(item.published_at||item.publishedAt)}</span></div></div>`;
  }).join("") + "</div>";
}
function updateCounts() {
  const t={all:allItems.length,aihot:0,"supply-chain":0,industry:0};
  allItems.forEach(i=>{if(t[i.category]!==undefined)t[i.category]++;});
  document.getElementById("cnt-all").textContent=t.all;
  document.getElementById("cnt-aihot").textContent=t.aihot;
  document.getElementById("cnt-supply").textContent=t["supply-chain"];
  document.getElementById("cnt-industry").textContent=t.industry;
}
function switchTab(tab) {
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("active",el.dataset.tab===tab));
  renderFeed(tab==="all"?allItems:allItems.filter(i=>i.category===tab));
}
async function fetchAihot() {
  const r=await fetch(AIHOT_API); if(!r.ok) throw new Error(`aihot ${r.status}`);
  const d=await r.json();
  return (d.items||[]).map(i=>({...i,category:"aihot",link:(i.links&&i.links.original)||"#",source_name:i.source?.name||"aihot.news",published_at:i.publishedAt}));
}
async function fetchCustom() {
  const r=await fetch(`${CUSTOM_JSON}?_=${Math.floor(Date.now()/60000)}`);
  if(!r.ok){console.warn("custom-sources.json 暂无");return[];}
  return (await r.json()).items||[];
}
async function loadAll() {
  try {
    const [a,c]=await Promise.allSettled([fetchAihot(),fetchCustom()]);
    allItems=[...(a.status==="fulfilled"?a.value:[]),...(c.status==="fulfilled"?c.value:[])]
      .sort((x,y)=>new Date(y.published_at||y.publishedAt||0)-new Date(x.published_at||x.publishedAt||0));
    updateCounts(); switchTab(currentTab);
    document.getElementById("last-updated").textContent=`更新于 ${new Date().toLocaleString("zh-CN",{hour:"2-digit",minute:"2-digit"})}`;
  } catch(e) {
    document.getElementById("feed-container").innerHTML=`<div class="state-box"><div class="icon">⚠️</div><p>加载失败：${esc(e.message)}</p></div>`;
  }
}
document.querySelectorAll(".tab").forEach(el=>el.addEventListener("click",()=>switchTab(el.dataset.tab)));
loadAll();
setInterval(loadAll,5*60*1000);
</script>
</body>
</html>
