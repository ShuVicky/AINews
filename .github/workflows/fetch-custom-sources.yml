name: Fetch Custom Sources

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser python-dateutil

      - name: Fetch RSS feeds
        run: python scripts/fetch_custom_sources.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/custom-sources.json
          git diff --cached --quiet || git commit -m "chore: update custom sources $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
